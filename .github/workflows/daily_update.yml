name: Yearly Data Update Pipeline

on:
  schedule:
    - cron: '0 0 1 1 *'  # Runs automatically once a year on Jan 1st
  workflow_dispatch:      # Allows manual trigger anytime if needed

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests gspread google-auth xgboost numpy

      - name: Run Data Extraction Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python main.py
